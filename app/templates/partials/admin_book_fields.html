{% set f = form or {} %}
{% set e = errors or {} %}
{% set defaults = book if book is defined else none %}

<div class="form-grid">
    <div class="form-field">
        <label for="title">Title *</label>
        <input
            type="text"
            id="title"
            name="title"
            placeholder="e.g. The Great Gatsby"
            value="{{ f.get('title') or (defaults.title if defaults else '') }}"
            class="{% if e.title %}input-invalid{% endif %}"
            aria-invalid="{{ 'true' if e.title else 'false' }}"
        >
        <span class="field-error" {% if not e.title %}hidden{% endif %}>{{ e.title or '' }}</span>
    </div>

    <div class="form-field">
        <label for="isbn">ISBN *</label>
        <input
            type="text"
            id="isbn"
            name="isbn"
            placeholder="e.g. 9780743273565"
            value="{{ f.get('isbn') or (defaults.isbn if defaults else '') }}"
            class="{% if e.isbn %}input-invalid{% endif %}"
            aria-invalid="{{ 'true' if e.isbn else 'false' }}"
        >
        <span class="field-error" {% if not e.isbn %}hidden{% endif %}>{{ e.isbn or '' }}</span>
    </div>

    <div class="form-field">
        <label for="author">Author *</label>
        <input
            type="text"
            id="author"
            name="author"
            placeholder="e.g. F. Scott Fitzgerald"
            value="{{ f.get('author') or (defaults.author if defaults else '') }}"
            class="{% if e.author %}input-invalid{% endif %}"
            aria-invalid="{{ 'true' if e.author else 'false' }}"
        >
        <span class="field-error" {% if not e.author %}hidden{% endif %}>{{ e.author or '' }}</span>
    </div>

    <div class="form-field">
        <label for="genre">Genre</label>
        <input
            type="text"
            id="genre"
            name="genre"
            placeholder="e.g. Fiction"
            value="{{ f.get('genre') or (defaults.genre if defaults else '') }}"
        >
    </div>

    <div class="form-field">
        <label for="price">Price ($) *</label>
        <input
            type="text"
            id="price"
            name="price"
            placeholder="0.00"
            value="{{ f['price'] if 'price' in f else (defaults.price if defaults else '') }}"
            class="{% if e.price %}input-invalid{% endif %}"
            aria-invalid="{{ 'true' if e.price else 'false' }}"
        >
        <span class="field-error" {% if not e.price %}hidden{% endif %}>{{ e.price or '' }}</span>
    </div>

    <div class="form-field">
        <label for="stock">Stock quantity *</label>
        <input
            type="text"
            id="stock"
            name="stock"
            placeholder="0"
            value="{{ f['stock'] if 'stock' in f else (defaults.stock if defaults else '') }}"
            class="{% if e.stock %}input-invalid{% endif %}"
            aria-invalid="{{ 'true' if e.stock else 'false' }}"
        >
        <span class="field-error" {% if not e.stock %}hidden{% endif %}>{{ e.stock or '' }}</span>
    </div>

    <div class="form-field wide">
        <label for="image_url">Cover image URL</label>
        <input
            type="text"
            id="image_url"
            name="image_url"
            placeholder="https://example.com/cover.jpg"
            value="{{ f.get('image_url') or (defaults.image_url if defaults else '') }}"
            class="{% if e.image_url %}input-invalid{% endif %}"
            aria-invalid="{{ 'true' if e.image_url else 'false' }}"
        >
        <span class="field-error" {% if not e.image_url %}hidden{% endif %}>{{ e.image_url or '' }}</span>
    </div>

    <div class="form-field wide">
        <label for="description">Description</label>
        <textarea id="description" name="description" placeholder="Short summary of the book…">{{ f.get('description') or (defaults.description if defaults else '') }}</textarea>
    </div>
</div>
