<footer class="site-footer site-footer-customer">
    <div class="footer-inner">
        <div class="footer-brand">
            <a href="{{ url_for('home') }}" title="Favourite Books Online">
                <img class="footer-logo" src="{{ url_for('static', filename='images/logo.png') }}" alt="Favourite Books logo">
            </a>
            <p class="footer-tagline">Glenferrie Road, Hawthorn</p>
        </div>
        <nav class="footer-links" aria-label="Footer navigation">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('catalogue.browse') }}">Books</a>
            {% if session.get('customer_logged_in') %}
                <a href="/cart">Cart</a>
                <a href="/orders">My Orders</a>
                <a href="{{ url_for('auth.logout') }}">Logout</a>
            {% else %}
                <a href="{{ url_for('auth.login') }}">Login</a>
                <a href="{{ url_for('auth.register') }}">Register</a>
            {% endif %}
            <a href="{{ url_for('admin.login') }}">Admin</a>
        </nav>
    </div>
    <p class="footer-copy">&copy; {{ 2026 }} Favourite Books Online</p>
</footer>
