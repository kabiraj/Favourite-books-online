{% extends 'base.html' %}

{% block content %}
<div class="page-title">
    <h2>Manage Books</h2>
    <a class="btn" href="{{ url_for('admin.add_book') }}">⊕ Add Book</a>
</div>

<table>
    <tr>
        <th>Title</th>
        <th>Author</th>
        <th>ISBN</th>
        <th>Genre</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Actions</th>
    </tr>

    {% for book in books %}
    <tr>
        <td>{{ book.title }}</td>
        <td>{{ book.author }}</td>
        <td class="isbn">{{ book.isbn }}</td>
        <td>{{ book.genre }}</td>
        <td>${{ book.price }}</td>
        <td><span class="stock">{{ book.stock }}</span></td>
        <td>
            <a class="edit-btn" href="{{ url_for('admin.edit_book', book_id=book.id) }}">Edit</a>
            <a class="delete-btn" href="{{ url_for('admin.delete_book', book_id=book.id) }}">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
