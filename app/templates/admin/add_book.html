{% extends 'base.html' %}

{% block container_class %}container container-admin{% endblock %}

{% block content %}
<div class="admin-form-page">
    <header class="admin-page-header">
        <h2>Add book</h2>
        <p>Add a new title to the catalogue. Required fields are marked with *.</p>
    </header>

    <div class="form-card admin-book-form">
        <form method="POST" action="{{ url_for('admin.add_book') }}" novalidate>
            {% include 'partials/admin_book_fields.html' %}

            <div class="form-actions">
                <button class="btn" type="submit">Add book</button>
                <a class="cancel-btn" href="{{ url_for('admin.catalogue') }}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
