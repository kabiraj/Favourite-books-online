{% extends 'base.html' %}

{% block content %}
<h2>Edit Book</h2>

<div class="form-card">
    <form method="POST">
        <div class="form-grid">
            <div>
                <label>Title *</label>
                <input type="text" name="title" value="{{ book.title }}" required>
            </div>

            <div>
                <label>ISBN *</label>
                <input type="text" name="isbn" value="{{ book.isbn }}" required>
            </div>

            <div>
                <label>Author *</label>
                <input type="text" name="author" value="{{ book.author }}" required>
            </div>

            <div>
                <label>Price ($) *</label>
                <input type="number" step="0.01" name="price" value="{{ book.price }}" required>
            </div>

            <div>
                <label>Stock Quantity *</label>
                <input type="number" name="stock" value="{{ book.stock }}" required>
            </div>

            <div>
                <label>Genre</label>
                <input type="text" name="genre" value="{{ book.genre }}">
            </div>

            <div class="wide">
                <label>Cover Image URL</label>
                <input type="text" name="image_url" value="{{ book.image_url }}">
            </div>

            <div class="wide">
                <label>Description</label>
                <textarea name="description">{{ book.description }}</textarea>
            </div>
        </div>

        <button class="btn" type="submit">Edit Book</button>
        <a class="cancel-btn" href="/admin/catalogue">Cancel</a>
    </form>
</div>
{% endblock %}
