{% extends 'base.html' %}

{% block container_class %}container container-admin{% endblock %}

{% block content %}
<div class="admin-form-page">
    <header class="admin-page-header">
        <h2>Edit book</h2>
        <p>Update details for <strong>{{ book.title }}</strong>.</p>
    </header>

    <div class="form-card admin-book-form">
        <form method="POST" action="{{ url_for('admin.edit_book', book_id=book.id) }}" novalidate>
            {% include 'partials/admin_book_fields.html' %}

            <div class="form-actions">
                <button class="btn" type="submit">Save changes</button>
                <a class="cancel-btn" href="{{ url_for('admin.catalogue') }}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
