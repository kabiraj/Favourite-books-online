{% extends 'base.html' %}

{% block container_class %}container container-admin{% endblock %}

{% block content %}
<div class="admin-form-page">
    <header class="admin-page-header">
        <h2>Edit book</h2>
        <p>Update details for <strong>{{ book.title }}</strong>.</p>
    </header>

    <div class="form-card admin-book-form">
        <form method="POST" action="{{ url_for('admin.edit_book', book_id=book.id) }}">
            <div class="form-grid">
                <div class="form-field">
                    <label for="title">Title *</label>
                    <input type="text" id="title" name="title" value="{{ book.title }}" required>
                </div>

                <div class="form-field">
                    <label for="isbn">ISBN *</label>
                    <input type="text" id="isbn" name="isbn" value="{{ book.isbn }}" required>
                </div>

                <div class="form-field">
                    <label for="author">Author *</label>
                    <input type="text" id="author" name="author" value="{{ book.author }}" required>
                </div>

                <div class="form-field">
                    <label for="genre">Genre</label>
                    <input type="text" id="genre" name="genre" value="{{ book.genre }}">
                </div>

                <div class="form-field">
                    <label for="price">Price ($) *</label>
                    <input type="number" id="price" step="0.01" min="0" name="price" value="{{ book.price }}" required>
                </div>

                <div class="form-field">
                    <label for="stock">Stock quantity *</label>
                    <input type="number" id="stock" min="0" name="stock" value="{{ book.stock }}" required>
                </div>

                <div class="form-field wide">
                    <label for="image_url">Cover image URL</label>
                    <input type="text" id="image_url" name="image_url" value="{{ book.image_url }}">
                </div>

                <div class="form-field wide">
                    <label for="description">Description</label>
                    <textarea id="description" name="description">{{ book.description }}</textarea>
                </div>
            </div>

            <div class="form-actions">
                <button class="btn" type="submit">Save changes</button>
                <a class="cancel-btn" href="{{ url_for('admin.catalogue') }}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
