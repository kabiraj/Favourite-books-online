{% extends 'base.html' %}

{% block body_class %}auth-page{% endblock %}
{% block navbar %}{% endblock %}

{% block page_wrapper %}
<section class="admin-login-page">
    {% include 'partials/flash_messages.html' %}
    <div class="login-wrapper">
        <div class="login-card">
            <a class="login-brand" href="{{ url_for('home') }}" title="Favourite Books Online">
                <img class="navbar-logo" src="{{ url_for('static', filename='images/logo.png') }}" alt="Favourite Books logo">
            </a>
            <h2>Admin Login</h2>
            <p>Sign in to manage the bookstore catalogue.</p>

            <form method="POST" action="{{ url_for('admin.login') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter admin username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >
                </div>

                <button class="submit-btn full-width" type="submit">Login</button>
            </form>

            <p class="login-footer">
                <a href="{{ url_for('home') }}">Back to store</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
