{% extends 'base.html' %}

{% block content %}

<div class="checkout-page">

    <div class="checkout-card">

        <div class="checkout-header">
            <h1>Checkout</h1>
            <p>Please enter your delivery details and choose a payment method to complete your order.</p>
        </div>

        <form method="POST" action="{{ url_for('customer.place_order') }}" class="checkout-form">

            <div class="form-group">
                <label for="customer_name">Customer Name</label>
                <input 
                    type="text" 
                    id="customer_name" 
                    name="customer_name" 
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Enter your email address"
                    required
                >
            </div>

            <div class="form-group">
                <label for="address">Delivery Address</label>
                <textarea 
                    id="address" 
                    name="address" 
                    placeholder="Enter your delivery address"
                    required
                ></textarea>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input 
                    type="text" 
                    id="phone" 
                    name="phone" 
                    placeholder="Enter your phone number"
                    required
                >
            </div>

            <div class="form-group">
                <label for="payment_method">Payment Method</label>
                <select id="payment_method" name="payment_method" required onchange="toggleCardDetails()">
                    <option value="">Select payment method</option>
                    <option value="Card">Card</option>
                    <option value="PayPal">PayPal</option>
                    <option value="Cash on Delivery">Cash on Delivery</option>
                </select>
            </div>

            <div id="card-details" class="card-details" style="display: none;">
                <h3>Card Details</h3>

                <div class="form-group">
                    <label for="card_name">Name on Card</label>
                    <input 
                        type="text" 
                        id="card_name" 
                        name="card_name" 
                        placeholder="Enter name on card"
                    >
                </div>

                <div class="form-group">
                    <label for="card_number">Card Number</label>
                    <input 
                        type="text" 
                        id="card_number" 
                        name="card_number" 
                        placeholder="1234 5678 9012 3456"
                        maxlength="19"
                    >
                </div>

                <div class="card-row">
                    <div class="form-group">
                        <label for="expiry_date">Expiry Date</label>
                        <input 
                            type="text" 
                            id="expiry_date" 
                            name="expiry_date" 
                            placeholder="MM/YY"
                            maxlength="5"
                        >
                    </div>

                    <div class="form-group">
                        <label for="cvv">CVV</label>
                        <input 
                            type="password" 
                            id="cvv" 
                            name="cvv" 
                            placeholder="123"
                            maxlength="4"
                        >
                    </div>
                </div>

                <p class="card-note">
                    This is a simplified card form for assignment demonstration only.
                </p>
            </div>

            <div class="checkout-actions">
                <a href="{{ url_for('customer.view_cart') }}" class="secondary-btn">Back to Cart</a>
                <button type="submit" class="primary-btn">Place Order</button>
            </div>

        </form>

    </div>

</div>

<script>
    function toggleCardDetails() {
        const paymentMethod = document.getElementById("payment_method").value;
        const cardDetails = document.getElementById("card-details");

        const cardName = document.getElementById("card_name");
        const cardNumber = document.getElementById("card_number");
        const expiryDate = document.getElementById("expiry_date");
        const cvv = document.getElementById("cvv");

        if (paymentMethod === "Card") {
            cardDetails.style.display = "block";

            cardName.required = true;
            cardNumber.required = true;
            expiryDate.required = true;
            cvv.required = true;
        } else {
            cardDetails.style.display = "none";

            cardName.required = false;
            cardNumber.required = false;
            expiryDate.required = false;
            cvv.required = false;

            cardName.value = "";
            cardNumber.value = "";
            expiryDate.value = "";
            cvv.value = "";
        }
    }
</script>

{% endblock %}
