{% extends 'base.html' %}

{% block content %}

<div class="checkout-page">

    <div class="checkout-card">

        <div class="checkout-header">
            <h1>Checkout</h1>
            <p>Please enter your delivery details and card payment information to complete your order.</p>
        </div>

        <form method="POST" action="{{ url_for('customer.place_order') }}" class="checkout-form">
            {% set f = form or {} %}

            <div class="form-group">
                <label for="customer_name">Customer Name</label>
                <input
                    type="text"
                    id="customer_name"
                    name="customer_name"
                    value="{{ f.get('customer_name') or (customer.name if customer else session.get('customer_name', '')) }}"
                    placeholder="Enter your full name"
                    minlength="4"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ f.get('email') or (customer.email if customer else session.get('customer_email', '')) }}"
                    placeholder="Enter your email address"
                    required
                >
            </div>

            <div class="form-group">
                <label for="address">Delivery Address</label>
                <textarea
                    id="address"
                    name="address"
                    placeholder="Enter your delivery address"
                    minlength="10"
                    required
                >{{ f.get('address') or (customer.address if customer else '') }}</textarea>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    value="{{ f.get('phone', '') }}"
                    placeholder="e.g. 0400000000"
                    minlength="10"
                    maxlength="20"
                    required
                >
            </div>

            <div class="form-group">
                <label for="payment_method">Payment Method</label>
                <select id="payment_method" name="payment_method" required>
                    <option value="Card" selected>Card</option>
                </select>
            </div>

            <div id="card-details" class="card-details">
                <h3>Card Details</h3>

                <div class="form-group">
                    <label for="card_name">Name on Card</label>
                    <input
                        type="text"
                        id="card_name"
                        name="card_name"
                        value="{{ f.get('card_name', '') }}"
                        placeholder="Enter name on card"
                        minlength="2"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="card_number">Card Number</label>
                    <input
                        type="text"
                        id="card_number"
                        name="card_number"
                        value="{{ f.get('card_number', '') }}"
                        placeholder="1234 5678 9012 3456"
                        maxlength="19"
                        pattern="[0-9\s]{16,19}"
                        title="Enter a 16-digit card number"
                        required
                    >
                </div>

                <div class="card-row">
                    <div class="form-group">
                        <label for="expiry_date">Expiry Date</label>
                        <input
                            type="text"
                            id="expiry_date"
                            name="expiry_date"
                            value="{{ f.get('expiry_date', '') }}"
                            placeholder="MM/YY"
                            maxlength="5"
                            pattern="(0[1-9]|1[0-2])\/[0-9]{2}"
                            title="Use MM/YY format, e.g. 12/28"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="cvv">CVV</label>
                        <input
                            type="password"
                            id="cvv"
                            name="cvv"
                            placeholder="123"
                            maxlength="3"
                            pattern="[0-9]{3}"
                            title="CVV must be 3 digits"
                            required
                        >
                    </div>
                </div>

                <p class="card-note">
                    This is a simplified card form for assignment demonstration only.
                </p>
            </div>

            <div class="checkout-actions">
                <a href="{{ url_for('customer.view_cart') }}" class="secondary-btn">Back to Cart</a>
                <button type="submit" class="primary-btn">Place Order</button>
            </div>

        </form>

    </div>

</div>

{% endblock %}
